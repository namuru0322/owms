<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>記事詳細 | OWMS ダッシュボード</title>
<!--
  OWMS 記事詳細画面 detail.html v1.6
  index.html のランキング表「詳細」ボタンから新しいタブで開かれる。
  クエリパラメータ path（記事パス）・title（記事タイトル）・period（期間キーワード、
  index.html の「期間」プルダウンと同じ値）を受け取り、GASの type=pageDetail から
  詳細データを取得して表示する。
  対応GASコード：v1.16

  補足（GASコードv1.16でのバグ修正）：
    ・GAS側のtype=aiAnalysisで、想定外のエラー時にJSON以外のレスポンスが返り、
      本来の原因に関わらず一律で「通信エラーが発生しました」と表示されてしまう
      不具合があったため、GAS側でエラーハンドリングを強化（detail.html側の変更なし）。

  変更点（v1.5 → v1.6）：
    ・最下部に「AI分析」セクションを新設。「AI分析を実行」ボタンを押すと、GASの
      新エンドポイント type=aiAnalysis を呼び出し、ChatGPT（成一郎さん自身の
      OpenAI APIキーを使用）による分析コメント（良い点・気になる点・次のアクション
      案）を取得して表示する。
    ・自動実行はせず、ボタンを押した時だけ実行するオンデマンド方式（ChatGPT APIは
      呼び出すたびに課金されるため）。GAS側で15分キャッシュしているため、同じ
      記事・同じ期間へ短時間に何度もボタンを押しても再課金されない。
    ・APIキーはGAS側のスクリプトプロパティに保存されており、このファイル・
      GitHubリポジトリには一切含まれない。

  変更点（v1.4 → v1.5）：
    ・「流入元の内訳」見出しの右上に「すべて展開」ボタンを追加。個別の三角ボタンを
      1つずつ押さなくても、このボタン1つで全チャネルグループの内訳（参照元）を
      一括で開閉できるようにした。展開状態に応じてボタンの表示は「すべて展開」
      ⇔「すべて閉じる」に切り替わる。データ取得や通信の仕様に変更はなし。

  変更点（v1.3 → v1.4）：
    ・「流入元の内訳」を2階層方式に変更。チャネルグループ（Direct／Organic Search等）
      の行はそのまま残し、クリックすると具体的な参照元（YouTube、Twitter(X)、
      Instagram等）の内訳が展開表示されるようにした。GASからのレスポンス形式が
      channels: [{ label, pv, sources: [{label, pv}, ...] }] に変わったのに合わせ、
      renderBreakdown（デバイス別内訳用に流用）とは別にrenderChannelBreakdown
      関数を新設。データは詳細画面を開いた時点で1回のAPI呼び出しに含めて取得済み
      のため、展開時に追加の通信は発生しない。

  変更点（v1.0 → v1.1）：
    ・「PV・ユーザー指標（前期間比較）」の数字だけでは今期間・前期間がいつからいつ
      までかが分かりにくかったため、上部に横棒（タイムライン）のビジュアルを追加。
      前期間（グレー）と今期間（アクセントカラー）を横並びの帯で表示し、
      帯の下に開始日・境目の日付・終了日をラベル表示する。
    ・画面タイトル横にバージョン番号を表示するように変更（index.htmlと同様の運用）。
    ・GASコード側の変更なし（v1.13のまま）。
  変更点（v1.1 → v1.2）：
    ・バージョン番号の表示位置を、記事タイトル横 → 最上部「← このタブを閉じる」の
      右側に変更（記事タイトルが長いと見づらくなるため）。
    ・GASコード側の変更なし（v1.13のまま）。
  変更点（v1.2 → v1.3）：
    ・「PV・ユーザー指標」見出しの右側に期間プルダウン（当日／7日間／2週間／
      1ヶ月／2ヶ月／3ヶ月、index.htmlの「期間」プルダウンと同じ選択肢）を追加。
      その場で期間を変更し、GASへ再問い合わせして表示を更新できるようにした
      （マスターシート11章②対応）。
    ・最初に開いたときの期間は、index.htmlで「詳細」を押した時点でINDEX側が
      表示していた期間（URLのperiodパラメータ）を引き継ぐ仕様は維持。
    ・GASコード側の変更なし（v1.13のまま。type=pageDetailは既にstartパラメータ
      を受け付ける実装だったため）。
-->
<style>
  :root {
    --bg: #1c2230;
    --panel: #262e40;
    --panel-2: #2f3850;
    --border: #3a4358;
    --text: #e8ecf4;
    --text-muted: #8b93a7;
    --accent: #e0a94a;
    --accent-dim: #6b5730;
    --up: #6bbf8a;
    --down: #d9736b;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    margin: 0;
    padding: 24px;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  .top-row { display: flex; align-items: center; justify-content: space-between; }
  a.back { color: var(--text-muted); text-decoration: none; font-size: 13px; }
  a.back:hover { color: var(--text); }
  .version-tag-top {
    color: var(--text-muted);
    font-size: 12px;
    font-weight: normal;
  }

  header { margin: 14px 0 20px; }
  header h1 { font-size: 18px; margin: 0 0 6px; }
  header .path { color: var(--text-muted); font-size: 13px; word-break: break-all; }
  header .meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .badge {
    display: inline-block;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 3px 10px;
    font-size: 12px;
    color: var(--text-muted);
  }
  .badge.new { color: var(--accent); border-color: var(--accent-dim); }

  .section {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 18px;
  }
  .section h2 { font-size: 14px; margin: 0 0 14px; color: var(--text); }

  .section-header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 14px;
  }
  .section-header-row h2 { margin: 0; }
  .period-select-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text-muted);
  }
  .period-select-row select {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 8px;
    font-size: 13px;
  }
  .expand-all-btn {
    background: var(--panel-2);
    color: var(--text-muted);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 12px;
    font-size: 12px;
    cursor: pointer;
  }
  .expand-all-btn:hover { color: var(--text); border-color: var(--accent-dim); }

  /* --- タイムラインビジュアル（今期間／前期間、v1.1） --- */
  .timeline-bar { margin-bottom: 10px; }
  .timeline-track {
    display: flex;
    height: 10px;
    border-radius: 5px;
    overflow: hidden;
    background: var(--panel-2);
  }
  .timeline-seg { flex: 1; }
  .timeline-seg.prev { background: var(--text-muted); opacity: 0.45; }
  .timeline-seg.cur { background: var(--accent); }
  .timeline-labels {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 5px;
    font-variant-numeric: tabular-nums;
  }
  .timeline-labels .tl-mid { flex: 0 0 auto; }
  .timeline-legend {
    display: flex;
    gap: 16px;
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 8px;
  }
  .tl-legend-item { display: flex; align-items: center; gap: 5px; }
  .tl-dot { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
  .tl-dot.prev { background: var(--text-muted); opacity: 0.45; }
  .tl-dot.cur { background: var(--accent); }

  .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
  }
  .stat-card {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
  }
  .stat-card .label { color: var(--text-muted); font-size: 12px; margin: 0 0 6px; }
  .stat-card .value { font-size: 20px; font-weight: 600; margin: 0; font-variant-numeric: tabular-nums; }
  .stat-card .diff { font-size: 12px; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .diff.up { color: var(--up); }
  .diff.down { color: var(--down); }
  .diff.flat { color: var(--text-muted); }

  .breakdown-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
    font-size: 13px;
  }
  .breakdown-row .bd-label { width: 130px; flex-shrink: 0; color: var(--text-muted); }
  .breakdown-row .bd-bar-wrap { flex: 1; background: var(--panel-2); border-radius: 4px; overflow: hidden; height: 14px; }
  .breakdown-row .bd-bar { background: var(--accent); height: 100%; }
  .breakdown-row .bd-value { width: 60px; text-align: right; flex-shrink: 0; font-variant-numeric: tabular-nums; }

  /* --- 流入元の内訳（2階層・チャネル→具体的な参照元、v1.4） --- */
  .breakdown-group { margin-bottom: 4px; }
  .breakdown-toggle { cursor: pointer; }
  .breakdown-toggle:hover .bd-label { color: var(--text); }
  .bd-chevron {
    display: inline-block;
    width: 10px;
    margin-right: 5px;
    font-size: 9px;
    color: var(--text-muted);
  }
  .breakdown-sub-wrap {
    margin: 2px 0 10px 20px;
    padding-left: 10px;
    border-left: 1px solid var(--border);
  }
  .breakdown-sub { margin-bottom: 6px; font-size: 12px; }
  .breakdown-sub .bd-label { color: var(--text-muted); width: 120px; }
  .breakdown-sub .bd-bar { background: var(--accent-dim); }
  .breakdown-sub-empty { color: var(--text-muted); font-size: 12px; padding: 2px 0 6px 4px; }

  .chart-svg-wrap { width: 100%; overflow-x: auto; }
  .chart-svg-wrap svg { width: 100%; height: auto; display: block; }
  .axis-line { stroke: var(--border); stroke-width: 1; }
  .axis-label { fill: var(--text-muted); font-size: 11px; }
  .grid-label { fill: var(--text-muted); font-size: 10px; }

  .status { color: var(--text-muted); font-size: 13px; text-align: center; padding: 30px 0; }
  .period-note { color: var(--text-muted); font-size: 12px; margin-top: 0; margin-bottom: 14px; }

  /* --- AI分析（v1.6） --- */
  .ai-analysis-btn {
    background: var(--accent-dim);
    color: var(--text);
    border: 1px solid var(--accent-dim);
    border-radius: 6px;
    padding: 8px 16px;
    font-size: 13px;
    cursor: pointer;
  }
  .ai-analysis-btn:hover { background: var(--accent); border-color: var(--accent); }
  .ai-analysis-btn:disabled { opacity: 0.5; cursor: default; }
  .ai-note { color: var(--text-muted); font-size: 11px; margin-top: 8px; }
  .ai-result {
    margin-top: 14px;
    padding: 14px 16px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.8;
    white-space: pre-wrap;
  }
  .ai-result.error { color: var(--down); }
  .ai-cached-tag { color: var(--text-muted); font-size: 11px; margin-top: 6px; }
</style>
</head>
<body>
<div class="wrap">

  <div class="top-row">
    <a class="back" href="javascript:window.close();">← このタブを閉じる</a>
    <span class="version-tag-top">v1.6</span>
  </div>

  <header>
    <h1 id="pageTitle">読み込み中…</h1>
    <div class="path" id="pagePath"></div>
    <div class="meta" id="pageMeta"></div>
  </header>

  <div class="section">
    <div class="section-header-row">
      <h2>PV・ユーザー指標（前期間比較）</h2>
      <div class="period-select-row">
        <label for="periodSelect">期間</label>
        <select id="periodSelect">
          <option value="today">当日</option>
          <option value="7daysAgo">7日間</option>
          <option value="14daysAgo">2週間</option>
          <option value="30daysAgo">1ヶ月</option>
          <option value="60daysAgo">2ヶ月</option>
          <option value="90daysAgo">3ヶ月</option>
        </select>
      </div>
    </div>
    <div class="timeline-bar" id="timelineBar"></div>
    <div class="period-note" id="periodNote"></div>
    <div class="stat-grid" id="statGrid">
      <div class="status">読み込み中…</div>
    </div>
  </div>

  <div class="section">
    <h2>日別PV推移</h2>
    <div class="chart-svg-wrap" id="trendWrap">
      <div class="status" id="trendEmpty">読み込み中…</div>
      <svg id="trendSvg" viewBox="0 0 700 220" style="display:none;"></svg>
    </div>
  </div>

  <div class="section">
    <div class="section-header-row">
      <h2>流入元の内訳</h2>
      <button id="channelExpandAllBtn" class="expand-all-btn" type="button">すべて展開</button>
    </div>
    <div id="channelBody"><div class="status">読み込み中…</div></div>
  </div>

  <div class="section">
    <h2>デバイス別内訳</h2>
    <div id="deviceBody"><div class="status">読み込み中…</div></div>
  </div>

  <div class="section">
    <h2>AI分析</h2>
    <button id="aiAnalysisBtn" class="ai-analysis-btn" type="button">AI分析を実行</button>
    <div class="ai-note">ボタンを押した時だけ実行されます（ChatGPT APIは呼び出すたびに課金されるため、自動実行はしません）。</div>
    <div id="aiResultWrap"></div>
  </div>

</div>

<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycbw4tle8lv9iQdM6F2gmlUUuILh4owSHaYSk9_8WX_d2h3tOzpHD8JFjTS9oiQs9Hkh_/exec";

  const qs = new URLSearchParams(location.search);
  const path = qs.get("path") || "";
  const title = qs.get("title") || "";

  const PERIOD_LABELS = {
    "today": "当日", "7daysAgo": "7日間", "14daysAgo": "2週間",
    "30daysAgo": "1ヶ月", "60daysAgo": "2ヶ月", "90daysAgo": "3ヶ月", "180daysAgo": "6ヶ月"
  };

  // 期間の状態。初期値はindex.htmlの「詳細」ボタンを押した時点でINDEX側が
  // 表示していた期間（URLのperiodパラメータ）を引き継ぐ。以後はプルダウン操作で更新。
  const periodSelect = document.getElementById("periodSelect");
  const validPeriods = Array.from(periodSelect.options).map(o => o.value);
  let currentPeriod = qs.get("period") || "7daysAgo";
  if (!validPeriods.includes(currentPeriod)) currentPeriod = "7daysAgo";
  periodSelect.value = currentPeriod;

  periodSelect.addEventListener("change", () => {
    currentPeriod = periodSelect.value;
    document.getElementById("aiResultWrap").innerHTML = ""; // 期間が変わったら古い分析結果は消す（v1.6）
    loadDetail();
  });

  document.getElementById("aiAnalysisBtn").addEventListener("click", loadAIAnalysis);

  document.getElementById("pagePath").textContent = path;

  function formatDateLabel(yyyymmdd) {
    const m = parseInt(yyyymmdd.substring(4, 6), 10);
    const d = parseInt(yyyymmdd.substring(6, 8), 10);
    return m + "/" + d;
  }

  // "2026-08-08" のようなハイフン区切りISO日付 → "8/8" 表示用
  function formatShortISO(isoDate) {
    const parts = isoDate.split("-");
    return parseInt(parts[1], 10) + "/" + parseInt(parts[2], 10);
  }

  function pct(v) { return (v * 100).toFixed(1) + "%"; }

  function diffHtml(current, previous, unit) {
    unit = unit || "";
    if (previous === 0) {
      if (current === 0) return '<div class="diff flat">前期間比 —</div>';
      return '<div class="diff up">前期間比 —（前期間0）</div>';
    }
    const diff = current - previous;
    const rate = (diff / previous) * 100;
    const sign = diff > 0 ? "+" : "";
    const cls = diff > 0 ? "up" : (diff < 0 ? "down" : "flat");
    return '<div class="diff ' + cls + '">前期間比 ' + sign + diff.toLocaleString() + unit + '（' + sign + rate.toFixed(1) + '%）</div>';
  }

  function statCard(label, currentVal, previousVal, displayFn, unit) {
    displayFn = displayFn || (v => v.toLocaleString());
    return `
      <div class="stat-card">
        <p class="label">${label}</p>
        <p class="value">${displayFn(currentVal)}</p>
        ${diffHtml(currentVal, previousVal, unit || "")}
      </div>
    `;
  }

  document.getElementById("pageTitle").textContent = title || "(タイトル不明)";

  if (!path) {
    document.getElementById("statGrid").innerHTML = '<div class="status">記事が指定されていません</div>';
  } else {
    loadDetail();
  }

  async function loadDetail() {
    // プルダウンで期間を変更して再取得する際、古いデータが一瞬残らないようリセット
    document.getElementById("statGrid").innerHTML = '<div class="status">読み込み中…</div>';
    document.getElementById("channelBody").innerHTML = '<div class="status">読み込み中…</div>';
    document.getElementById("deviceBody").innerHTML = '<div class="status">読み込み中…</div>';
    document.getElementById("trendEmpty").textContent = "読み込み中…";
    document.getElementById("trendEmpty").style.display = "block";
    document.getElementById("trendSvg").style.display = "none";

    try {
      const url = GAS_URL + "?type=pageDetail&path=" + encodeURIComponent(path) + "&start=" + encodeURIComponent(currentPeriod);
      const res = await fetch(url);
      const data = await res.json();

      if (!data.ok) {
        document.getElementById("statGrid").innerHTML = '<div class="status">取得エラー: ' + data.error + '</div>';
        return;
      }

      renderMeta(data);
      renderStats(data);
      renderTrend(data.trend);
      renderChannelBreakdown("channelBody", data.channels);
      renderBreakdown("deviceBody", data.devices, "デバイス");

    } catch (err) {
      document.getElementById("statGrid").innerHTML = '<div class="status">通信エラーが発生しました</div>';
      console.error("pageDetail取得失敗:", err);
    }
  }

  function renderMeta(data) {
    const meta = document.getElementById("pageMeta");
    let badges = '<span class="badge">' + data.category + '</span>';
    if (data.isNew) badges += '<span class="badge new">NEW</span>';
    if (data.publishDate) {
      badges += '<span class="badge">公開日: ' + data.publishDate + '</span>';
      badges += '<span class="badge">公開から ' + data.daysSincePublish + '日</span>';
    } else {
      badges += '<span class="badge">公開日: 不明</span>';
    }
    meta.innerHTML = badges;

    const periodLabel = PERIOD_LABELS[data.period] || data.period;
    document.getElementById("periodNote").textContent =
      "今期間：" + data.currentRange.start + "〜" + data.currentRange.end + "（" + periodLabel + "）　／　" +
      "前期間：" + data.previousRange.start + "〜" + data.previousRange.end;

    renderTimeline(data.currentRange, data.previousRange);
  }

  // 今期間・前期間を横棒（タイムライン）で視覚的に表示する（v1.1）
  // 前期間と今期間は常に同じ日数なので、帯は単純に左右50/50で分割する。
  function renderTimeline(currentRange, previousRange) {
    const wrap = document.getElementById("timelineBar");
    const boundaryLabel = formatShortISO(previousRange.end) + " 〜 " + formatShortISO(currentRange.start);

    wrap.innerHTML = `
      <div class="timeline-track">
        <div class="timeline-seg prev" title="前期間: ${previousRange.start}〜${previousRange.end}"></div>
        <div class="timeline-seg cur" title="今期間: ${currentRange.start}〜${currentRange.end}"></div>
      </div>
      <div class="timeline-labels">
        <span class="tl-left">${formatShortISO(previousRange.start)}</span>
        <span class="tl-mid">${boundaryLabel}</span>
        <span class="tl-right">${formatShortISO(currentRange.end)}</span>
      </div>
      <div class="timeline-legend">
        <span class="tl-legend-item"><i class="tl-dot prev"></i>前期間</span>
        <span class="tl-legend-item"><i class="tl-dot cur"></i>今期間</span>
      </div>
    `;
  }

  function renderStats(data) {
    const c = data.metrics.current;
    const p = data.metrics.previous;
    const grid = document.getElementById("statGrid");
    grid.innerHTML =
      statCard("PV数", c.pv, p.pv) +
      statCard("アクティブユーザー数", c.activeUsers, p.activeUsers) +
      statCard("新規ユーザー数", c.newUsers, p.newUsers) +
      statCard("エンゲージ率", c.engagementRate, p.engagementRate, pct, "pt") +
      statCard("直帰率", c.bounceRate, p.bounceRate, pct, "pt") +
      statCard("平均エンゲージメント時間", c.avgEngagementSec, p.avgEngagementSec, v => v + "秒", "秒");
  }

  function renderTrend(trend) {
    const emptyEl = document.getElementById("trendEmpty");
    const svgEl = document.getElementById("trendSvg");

    if (!trend || !trend.dates || trend.dates.length < 2) {
      emptyEl.textContent = "この期間はデータの日数が少なく、推移グラフを表示できません";
      emptyEl.style.display = "block";
      svgEl.style.display = "none";
      return;
    }

    emptyEl.style.display = "none";
    svgEl.style.display = "block";

    const width = 700, height = 220;
    const padLeft = 42, padRight = 10, padTop = 14, padBottom = 30;
    const chartW = width - padLeft - padRight;
    const chartH = height - padTop - padBottom;

    const dates = trend.dates;
    const values = trend.values;
    const maxV = Math.max(...values, 1);
    const yMax = Math.ceil(maxV * 1.15 / 5) * 5 || 5;
    const n = dates.length;
    const stepX = n > 1 ? chartW / (n - 1) : 0;

    let labelStep = 1;
    if (n > 60) labelStep = 10;
    else if (n > 30) labelStep = 5;
    else if (n > 14) labelStep = 2;

    let svg = '';
    for (let i = 0; i <= 4; i++) {
      const val = Math.round(yMax * i / 4);
      const y = padTop + chartH - (chartH * i / 4);
      svg += `<line class="axis-line" x1="${padLeft}" y1="${y}" x2="${width - padRight}" y2="${y}" />`;
      svg += `<text class="grid-label" x="${padLeft - 6}" y="${y + 3}" text-anchor="end">${val.toLocaleString()}</text>`;
    }
    dates.forEach((date, i) => {
      if (i % labelStep === 0 || i === n - 1) {
        const x = padLeft + i * stepX;
        svg += `<text class="axis-label" x="${x.toFixed(1)}" y="${height - padBottom + 16}" text-anchor="middle">${formatDateLabel(date)}</text>`;
      }
    });

    const points = values.map((v, i) => {
      const x = padLeft + i * stepX;
      const y = padTop + chartH - (v / yMax) * chartH;
      return x.toFixed(1) + "," + y.toFixed(1);
    }).join(" ");
    svg += `<polyline points="${points}" fill="none" stroke="#e0a94a" stroke-width="2" />`;
    values.forEach((v, i) => {
      const x = padLeft + i * stepX;
      const y = padTop + chartH - (v / yMax) * chartH;
      svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.5" fill="#e0a94a"><title>${formatDateLabel(dates[i])}: ${v.toLocaleString()} PV</title></circle>`;
    });

    svgEl.innerHTML = svg;
  }

  // 「流入元の内訳」を2階層（チャネルグループ→具体的な参照元）で表示する（v1.4）。
  // データは既に1回のAPI呼び出しで取得済みのため、クリック展開時の追加通信は発生しない。
  // 見出し右上の「すべて展開」ボタンで、全チャネルグループの内訳を一括開閉できる（v1.5）。
  function renderChannelBreakdown(containerId, items) {
    const el = document.getElementById(containerId);
    const expandAllBtn = document.getElementById("channelExpandAllBtn");

    if (!items || items.length === 0) {
      el.innerHTML = '<div class="status">この期間のデータはありません</div>';
      expandAllBtn.style.display = "none";
      return;
    }
    expandAllBtn.style.display = "";
    expandAllBtn.textContent = "すべて展開";

    const total = items.reduce((sum, item) => sum + item.pv, 0) || 1;

    el.innerHTML = items.map((item, idx) => {
      const ratio = Math.round((item.pv / total) * 100);
      const subId = containerId + "-sub-" + idx;
      const subTotal = item.pv || 1;
      const sources = item.sources || [];

      const subRows = sources.length > 0
        ? sources.map(s => {
            const subRatio = Math.round((s.pv / subTotal) * 100);
            return `
              <div class="breakdown-row breakdown-sub">
                <div class="bd-label">${s.label || "(不明)"}</div>
                <div class="bd-bar-wrap"><div class="bd-bar" style="width:${subRatio}%"></div></div>
                <div class="bd-value">${s.pv.toLocaleString()} (${subRatio}%)</div>
              </div>
            `;
          }).join("")
        : '<div class="breakdown-sub-empty">参照元の内訳データなし</div>';

      return `
        <div class="breakdown-group">
          <div class="breakdown-row breakdown-toggle" data-target="${subId}">
            <div class="bd-label"><span class="bd-chevron">▶</span>${item.label || "(不明)"}</div>
            <div class="bd-bar-wrap"><div class="bd-bar" style="width:${ratio}%"></div></div>
            <div class="bd-value">${item.pv.toLocaleString()} (${ratio}%)</div>
          </div>
          <div class="breakdown-sub-wrap" id="${subId}" style="display:none;">${subRows}</div>
        </div>
      `;
    }).join("");

    el.querySelectorAll(".breakdown-toggle").forEach(rowEl => {
      rowEl.addEventListener("click", () => {
        const subEl = document.getElementById(rowEl.getAttribute("data-target"));
        const chevron = rowEl.querySelector(".bd-chevron");
        const isOpen = subEl.style.display !== "none";
        subEl.style.display = isOpen ? "none" : "block";
        chevron.textContent = isOpen ? "▶" : "▼";
      });
    });

    // 「すべて展開」ボタン：現在いずれかが閉じていれば全展開、全部開いていれば全て閉じる（v1.5）
    expandAllBtn.onclick = () => {
      const subWraps = el.querySelectorAll(".breakdown-sub-wrap");
      const chevrons = el.querySelectorAll(".bd-chevron");
      const anyCollapsed = Array.from(subWraps).some(w => w.style.display === "none");
      subWraps.forEach(w => { w.style.display = anyCollapsed ? "block" : "none"; });
      chevrons.forEach(c => { c.textContent = anyCollapsed ? "▼" : "▶"; });
      expandAllBtn.textContent = anyCollapsed ? "すべて閉じる" : "すべて展開";
    };
  }

  // 「AI分析を実行」ボタンから呼ばれる。GASのtype=aiAnalysisを叩き、
  // ChatGPTによる分析コメントを取得して表示する（v1.6、オンデマンド実行）。
  async function loadAIAnalysis() {
    const btn = document.getElementById("aiAnalysisBtn");
    const wrap = document.getElementById("aiResultWrap");

    btn.disabled = true;
    btn.textContent = "分析中…";
    wrap.innerHTML = '<div class="status">ChatGPTが分析中です…（数秒〜十数秒かかることがあります）</div>';

    try {
      const url = GAS_URL + "?type=aiAnalysis&path=" + encodeURIComponent(path) + "&start=" + encodeURIComponent(currentPeriod);
      const res = await fetch(url);
      const data = await res.json();

      if (!data.ok) {
        wrap.innerHTML = '<div class="ai-result error">' + (data.error || "分析に失敗しました") + '</div>';
      } else {
        const cachedNote = data.cached ? '<div class="ai-cached-tag">（直近15分以内の分析結果をキャッシュから表示しています）</div>' : '';
        wrap.innerHTML = '<div class="ai-result">' + escapeHtml(data.analysis) + '</div>' + cachedNote;
      }
    } catch (err) {
      wrap.innerHTML = '<div class="ai-result error">通信エラーが発生しました</div>';
      console.error("aiAnalysis取得失敗:", err);
    } finally {
      btn.disabled = false;
      btn.textContent = "AI分析を実行";
    }
  }

  // ai-resultはwhite-space:pre-wrapでそのまま改行を活かして表示するため、
  // ChatGPTの返答テキストはHTMLエスケープしてから挿入する
  function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
  }

  function renderBreakdown(containerId, items, emptyLabel) {
    const el = document.getElementById(containerId);
    if (!items || items.length === 0) {
      el.innerHTML = '<div class="status">この期間のデータはありません</div>';
      return;
    }
    const total = items.reduce((sum, item) => sum + item.pv, 0) || 1;
    el.innerHTML = items.map(item => {
      const ratio = Math.round((item.pv / total) * 100);
      return `
        <div class="breakdown-row">
          <div class="bd-label">${item.label || "(不明)"}</div>
          <div class="bd-bar-wrap"><div class="bd-bar" style="width:${ratio}%"></div></div>
          <div class="bd-value">${item.pv.toLocaleString()} (${ratio}%)</div>
        </div>
      `;
    }).join("");
  }
</script>
</body>
</html>
