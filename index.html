<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>OWMS ダッシュボード | ワンズウィルミュージックスクール</title>
<!--
  OWMS ダッシュボード v1.9
  変更点（初版 → v1.1）：
    ・タブ切替のたびにGASへ問い合わせていたのをやめ、期間変更時に一度だけ
      「全カテゴリー分」を取得し、タブ切替はブラウザ内のデータを出し分けるだけにした。
    ・「総合」タブを新設し、起動時デフォルトで表示するように変更。
    ・タブの並び順を 総合／ボイトレ系／スクール関連／DTM系／その他ブログ に変更。
  変更点（v1.1 → v1.2）：
    ・タブの並び順を 総合／ボイトレ系／DTM系／スクール関連／その他ブログ に変更。
  変更点（v1.2 → v1.3）：
    ・画面タイトルの横にバージョン番号を表示するように変更。
  変更点（v1.3 → v1.4）：
    ・期間ごとにデータを15分間キャッシュするように変更。
  変更点（v1.4 → v1.5）：
    ・キャッシュ有効期間を5分→15分に変更。
  変更点（v1.5 → v1.6）：
    ・新カテゴリー「NEW」を追加。タブ表示順を
      総合／NEW／ボイトレ系／DTM系／スクール関連／その他ブログ に更新。
  変更点（v1.6 → v1.7）：
    ・アクティブユーザー数とカテゴリー一括取得を同時に2本投げていたのを、
      1本ずつ順番に投げる方式に変更（詰まって通信エラーになる不具合の対応）。
  変更点（v1.7 → v1.8）：
    ・最上部に「サイト全体PV推移」の縦棒グラフ、その下に「カテゴリーランキング推移
      （1〜10位）」の線グラフを追加。線はチェックボックスでON/OFF、グラフ全体も
      表示/非表示を切替可能。外部ライブラリは使わず素のSVGで実装。
  変更点（v1.8 → v1.9）：
    ・起動時に4回、期間変更時に2回、順番にGASを呼んでいたため、1回10秒前後×
      複数回で合計30秒以上かかり、途中でタイムアウトして通信エラーになる不具合が
      発生。GAS側に複合エンドポイント（dashboardInit／periodData）を新設し、
      起動時・期間変更時はそれぞれ1回のリクエストで必要なデータを全部まとめて
      取得するように変更（GAS側 v1.9 に対応）。
  変更点（v1.9 → v1.10）：
    ・「カテゴリーランキング推移」（線グラフ）をデフォルト非表示に変更。
      線グラフの取得は一番負荷が重いため、起動時・期間変更時には呼ばず、
      「表示する」ボタンを押して開いたときだけ個別に取得する方式にした。
      これにより起動時・期間変更時にGASへ投げる内容がさらに軽くなる。
      （GAS側 v1.10：dashboardInit／periodDataから線グラフ用データを除外）
-->
<style>
  :root {
    --bg: #1c2230;
    --panel: #262e40;
    --panel-2: #2f3850;
    --border: #3a4358;
    --text: #eef1f7;
    --text-muted: #9aa5bb;
    --accent: #e0a94a;
    --accent-dim: #6b5730;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 40px 32px 80px;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
    max-width: 1100px;
    margin-left: auto;
    margin-right: auto;
  }
  header { margin-bottom: 28px; }
  header .eyebrow {
    color: var(--accent);
    font-size: 13px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin: 0 0 6px;
  }
  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 30px;
    margin: 0 0 4px;
    font-weight: normal;
  }
  header p.sub { color: var(--text-muted); margin: 0; font-size: 14px; }
  header .version-tag {
    color: var(--text-muted);
    font-size: 12px;
    font-weight: normal;
    vertical-align: middle;
    margin-left: 10px;
  }

  .period-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 24px 0 20px;
  }
  .period-bar label { font-size: 13px; color: var(--text-muted); }
  select {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 10px;
    font-size: 14px;
  }

  .stat-row { display: flex; gap: 16px; margin-bottom: 32px; flex-wrap: wrap; }
  .stat-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 22px;
    min-width: 200px;
    flex: 1;
  }
  .stat-card .label { font-size: 13px; color: var(--text-muted); margin: 0 0 8px; }
  .stat-card .value { font-size: 32px; font-weight: 600; margin: 0; }
  .stat-card .value.loading { color: var(--text-muted); font-size: 18px; font-weight: normal; }

  .tabs { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
  .tab {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
  }
  .tab:hover { border-color: var(--accent-dim); color: var(--text); }
  .tab.active {
    background: var(--accent-dim);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 600;
  }

  table { width: 100%; border-collapse: collapse; background: var(--panel); border-radius: 10px; overflow: hidden; }
  thead th {
    text-align: left;
    font-size: 12px;
    color: var(--text-muted);
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    font-weight: normal;
  }
  tbody td {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
    vertical-align: top;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--panel-2); }
  td.rank { color: var(--accent); font-weight: 600; width: 36px; }
  td.pv { text-align: right; font-variant-numeric: tabular-nums; width: 70px; color: var(--text); }
  td.path { color: var(--text-muted); font-size: 12px; }
  td.title a { color: var(--text); text-decoration: none; }
  td.title a:hover { color: var(--accent); }

  .status { color: var(--text-muted); font-size: 13px; padding: 20px; text-align: center; }

  .chart-section {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px 22px;
    margin-bottom: 24px;
  }
  .chart-section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
    flex-wrap: wrap;
    gap: 10px;
  }
  .chart-section-header h2 {
    font-size: 15px;
    font-weight: 600;
    margin: 0;
    color: var(--text);
  }
  .chart-controls { display: flex; align-items: center; gap: 10px; }
  .chart-toggle-btn {
    background: var(--panel-2);
    color: var(--text-muted);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 14px;
    font-size: 13px;
    cursor: pointer;
  }
  .chart-toggle-btn:hover { border-color: var(--accent-dim); color: var(--text); }

  .chart-svg-wrap { width: 100%; overflow-x: auto; }
  .chart-svg-wrap svg { width: 100%; height: auto; display: block; }
  .chart-svg-wrap.hidden { display: none; }

  .bar-rect { fill: var(--accent); }
  .bar-rect:hover { fill: #f0bd6a; }
  .axis-line { stroke: var(--border); stroke-width: 1; }
  .axis-label { fill: var(--text-muted); font-size: 11px; }
  .grid-label { fill: var(--text-muted); font-size: 10px; }

  .trend-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 16px;
    margin-bottom: 14px;
  }
  .trend-legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-muted);
    cursor: pointer;
    user-select: none;
    max-width: 260px;
  }
  .trend-legend-item input { accent-color: var(--accent); cursor: pointer; }
  .trend-legend-swatch {
    width: 10px;
    height: 10px;
    border-radius: 2px;
    flex-shrink: 0;
  }
  .trend-legend-item .legend-title {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .trend-legend-item.off { opacity: 0.4; }

  .chart-empty { color: var(--text-muted); font-size: 13px; text-align: center; padding: 30px 0; }
</style>
</head>
<body>

<header>
  <p class="eyebrow">Ones-Will Music School</p>
  <h1>OWMS ダッシュボード<span class="version-tag">v1.10</span></h1>
  <p class="sub">サイト全体のアクセス状況とページ別ランキング</p>
</header>

<!-- ① サイト全体PV推移（縦棒グラフ） -->
<div class="chart-section">
  <div class="chart-section-header">
    <h2>サイト全体PV推移</h2>
    <div class="chart-controls">
      <select id="pvBarPeriod">
        <option value="7daysAgo" selected>7日</option>
        <option value="14daysAgo">2週間</option>
        <option value="30daysAgo">1ヶ月</option>
        <option value="90daysAgo">3ヶ月</option>
      </select>
    </div>
  </div>
  <div class="chart-svg-wrap" id="pvBarWrap">
    <div class="chart-empty" id="pvBarEmpty">読み込み中…</div>
    <svg id="pvBarSvg" viewBox="0 0 1000 260" style="display:none;"></svg>
  </div>
</div>

<!-- ② カテゴリーランキング推移（線グラフ、1〜10位） -->
<div class="chart-section">
  <div class="chart-section-header">
    <h2>カテゴリーランキング推移（1〜10位）</h2>
    <div class="chart-controls">
      <button class="chart-toggle-btn" id="trendToggleBtn">表示する</button>
    </div>
  </div>
  <div id="trendBody" style="display:none;">
    <div class="trend-legend" id="trendLegend"></div>
    <div class="chart-svg-wrap" id="trendWrap">
      <div class="chart-empty" id="trendEmpty">読み込み中…</div>
      <svg id="trendSvg" viewBox="0 0 1000 300" style="display:none;"></svg>
    </div>
  </div>
</div>

<div class="period-bar">
  <label for="period">期間</label>
  <select id="period">
    <option value="today">当日</option>
    <option value="7daysAgo" selected>7日間</option>
    <option value="14daysAgo">2週間</option>
    <option value="30daysAgo">1ヶ月</option>
    <option value="60daysAgo">2ヶ月</option>
    <option value="90daysAgo">3ヶ月</option>
  </select>
</div>

<div class="stat-row">
  <div class="stat-card">
    <p class="label">アクティブユーザー数</p>
    <p class="value loading" id="activeUsersValue">読み込み中…</p>
  </div>
</div>

<!-- 並び順：総合／NEW／ボイトレ系／DTM系／スクール関連／その他ブログ -->
<div class="tabs" id="tabs">
  <div class="tab active" data-category="総合">総合</div>
  <div class="tab" data-category="NEW">NEW</div>
  <div class="tab" data-category="ボイトレ系">ボイトレ系</div>
  <div class="tab" data-category="DTM系">DTM系</div>
  <div class="tab" data-category="スクール関連">スクール関連</div>
  <div class="tab" data-category="その他ブログ">その他ブログ</div>
</div>

<table>
  <thead>
    <tr>
      <th></th>
      <th>タイトル</th>
      <th style="text-align:right;">PV</th>
    </tr>
  </thead>
  <tbody id="rankingBody">
    <tr><td colspan="3" class="status">読み込み中…</td></tr>
  </tbody>
</table>

<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycbw4tle8lv9iQdM6F2gmlUUuILh4owSHaYSk9_8WX_d2h3tOzpHD8JFjTS9oiQs9Hkh_/exec";

  let currentCategory = "総合";
  let categoriesCache = null;

  // 期間ごとのキャッシュ（アクティブユーザー数＋カテゴリー一括）
  const periodCache = {};
  const CACHE_TTL_MS = 15 * 60 * 1000; // 15分

  // 棒グラフ用キャッシュ（期間ごと）
  const barCache = {};
  // 線グラフ用キャッシュ（カテゴリー＋期間ごと）
  const trendCache = {};

  const TREND_COLORS = [
    '#e0a94a', '#5aa9e6', '#7bc47f', '#e6799a', '#c792ea',
    '#f2c14e', '#4dd0c9', '#ff8c69', '#9fa8da', '#f06a6a'
  ];

  function currentPeriod() {
    return document.getElementById("period").value;
  }

  function currentBarPeriod() {
    return document.getElementById("pvBarPeriod").value;
  }

  function applyActiveUsers(value) {
    const el = document.getElementById("activeUsersValue");
    el.textContent = Number(value).toLocaleString() + " 人";
    el.classList.remove("loading");
  }

  function setActiveUsersLoading() {
    const el = document.getElementById("activeUsersValue");
    el.textContent = "読み込み中…";
    el.classList.add("loading");
  }

  function setRankingLoading() {
    document.getElementById("rankingBody").innerHTML = '<tr><td colspan="3" class="status">読み込み中…</td></tr>';
  }

  // ============================================================
  // 起動時：dashboardInit で1回にまとめて取得
  // （アクティブユーザー数／カテゴリー一括／棒グラフ、まとめて1回）
  // 線グラフ（カテゴリーランキング推移）はデフォルト非表示なので、
  // ここでは取得しない。「表示する」ボタンを押したときに個別取得する。
  // ============================================================
  async function loadDashboardInit() {
    const period = currentPeriod();
    const barPeriod = currentBarPeriod();

    setActiveUsersLoading();
    setRankingLoading();
    setChartLoading("pvBarEmpty", "pvBarSvg");

    try {
      const url = GAS_URL + "?type=dashboardInit&start=" + period + "&end=today&barStart=" + barPeriod;
      const res = await fetch(url);
      const data = await res.json();

      if (!data.ok) {
        document.getElementById("activeUsersValue").textContent = "取得エラー";
        document.getElementById("rankingBody").innerHTML = '<tr><td colspan="3" class="status">取得エラー: ' + data.error + '</td></tr>';
        return;
      }

      const now = Date.now();

      applyActiveUsers(data.activeUsers);
      categoriesCache = data.categories;
      renderRanking();
      periodCache[period] = { timestamp: now, activeUsers: data.activeUsers, categories: data.categories };

      renderPvBarChart(data.dailyPV);
      barCache[barPeriod] = { timestamp: now, data: data.dailyPV };

    } catch (err) {
      document.getElementById("activeUsersValue").textContent = "通信エラー";
      document.getElementById("rankingBody").innerHTML = '<tr><td colspan="3" class="status">通信エラーが発生しました</td></tr>';
      console.error("dashboardInit取得失敗:", err);
    }
  }

  // ============================================================
  // 期間プルダウン変更時：periodData で1回にまとめて取得
  // （アクティブユーザー数／カテゴリー一括、まとめて1回）
  // 線グラフが今開いている場合だけ、追加でloadTrendChart()を呼んで更新する。
  // ============================================================
  async function loadPeriodData() {
    const period = currentPeriod();
    const cached = periodCache[period];
    const now = Date.now();

    if (cached && (now - cached.timestamp) < CACHE_TTL_MS) {
      applyActiveUsers(cached.activeUsers);
      categoriesCache = cached.categories;
      renderRanking();
      if (isTrendVisible()) await loadTrendChart();
      return;
    }

    setActiveUsersLoading();
    setRankingLoading();

    try {
      const url = GAS_URL + "?type=periodData&start=" + period + "&end=today&category=" + encodeURIComponent(currentCategory);
      const res = await fetch(url);
      const data = await res.json();

      if (!data.ok) {
        document.getElementById("activeUsersValue").textContent = "取得エラー";
        document.getElementById("rankingBody").innerHTML = '<tr><td colspan="3" class="status">取得エラー: ' + data.error + '</td></tr>';
        return;
      }

      applyActiveUsers(data.activeUsers);
      categoriesCache = data.categories;
      renderRanking();
      periodCache[period] = { timestamp: now, activeUsers: data.activeUsers, categories: data.categories };

      if (isTrendVisible()) await loadTrendChart();

    } catch (err) {
      document.getElementById("activeUsersValue").textContent = "通信エラー";
      document.getElementById("rankingBody").innerHTML = '<tr><td colspan="3" class="status">通信エラーが発生しました</td></tr>';
      console.error("periodData取得失敗:", err);
    }
  }

  function renderRanking() {
    const body = document.getElementById("rankingBody");
    if (!categoriesCache) {
      body.innerHTML = '<tr><td colspan="3" class="status">読み込み中…</td></tr>';
      return;
    }
    const items = categoriesCache[currentCategory] || [];
    if (items.length > 0) {
      body.innerHTML = items.slice(0, 30).map((item, i) => `
        <tr>
          <td class="rank">${i + 1}</td>
          <td class="title">
            <a href="https://www.ones-will.com${item.path}" target="_blank">${item.title}</a>
            <div class="path">${item.path}</div>
          </td>
          <td class="pv">${item.pv.toLocaleString()}</td>
        </tr>
      `).join("");
    } else {
      body.innerHTML = '<tr><td colspan="3" class="status">この期間・カテゴリーのデータはありません</td></tr>';
    }
  }

  document.getElementById("tabs").addEventListener("click", async (e) => {
    const tab = e.target.closest(".tab");
    if (!tab) return;
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    currentCategory = tab.dataset.category;
    renderRanking();
    if (isTrendVisible()) await loadTrendChart(); // 線グラフが開いている時だけ更新する
  });

  document.getElementById("period").addEventListener("change", async () => {
    await loadPeriodData();
  });

  // ============================================================
  // ① サイト全体PV推移（縦棒グラフ）
  // ============================================================

  function setChartLoading(emptyId, svgId) {
    const emptyEl = document.getElementById(emptyId);
    const svgEl = document.getElementById(svgId);
    emptyEl.textContent = "読み込み中…";
    emptyEl.style.display = "block";
    svgEl.style.display = "none";
  }

  async function loadPvBarChart() {
    const period = currentBarPeriod();
    const cached = barCache[period];
    const now = Date.now();

    if (cached && (now - cached.timestamp) < CACHE_TTL_MS) {
      renderPvBarChart(cached.data);
      return;
    }

    setChartLoading("pvBarEmpty", "pvBarSvg");

    try {
      const res = await fetch(GAS_URL + "?type=dailyPV&start=" + period + "&end=today");
      const data = await res.json();
      if (data.ok) {
        barCache[period] = { timestamp: now, data: data.data };
        renderPvBarChart(data.data);
      } else {
        document.getElementById("pvBarEmpty").textContent = "取得エラー: " + data.error;
      }
    } catch (err) {
      document.getElementById("pvBarEmpty").textContent = "通信エラーが発生しました";
      console.error("dailyPV取得失敗:", err);
    }
  }

  function formatDateLabel(yyyymmdd) {
    const m = parseInt(yyyymmdd.substring(4, 6), 10);
    const d = parseInt(yyyymmdd.substring(6, 8), 10);
    return m + "/" + d;
  }

  function renderPvBarChart(data) {
    const emptyEl = document.getElementById("pvBarEmpty");
    const svgEl = document.getElementById("pvBarSvg");

    if (!data || data.length === 0) {
      emptyEl.textContent = "この期間のデータはありません";
      emptyEl.style.display = "block";
      svgEl.style.display = "none";
      return;
    }

    emptyEl.style.display = "none";
    svgEl.style.display = "block";

    const width = 1000, height = 260;
    const padLeft = 46, padRight = 10, padTop = 16, padBottom = 34;
    const chartW = width - padLeft - padRight;
    const chartH = height - padTop - padBottom;

    const maxPv = Math.max(...data.map(d => d.pv), 1);
    const yMax = Math.ceil(maxPv * 1.15 / 5) * 5 || 5;

    const n = data.length;
    const gap = n > 40 ? 1 : (n > 14 ? 2 : 6);
    const barW = Math.max((chartW - gap * (n - 1)) / n, 1);

    let labelStep = 1;
    if (n > 60) labelStep = 10;
    else if (n > 30) labelStep = 5;
    else if (n > 14) labelStep = 2;

    let svg = '';

    for (let i = 0; i <= 4; i++) {
      const val = Math.round(yMax * i / 4);
      const y = padTop + chartH - (chartH * i / 4);
      svg += `<line class="axis-line" x1="${padLeft}" y1="${y}" x2="${width - padRight}" y2="${y}" />`;
      svg += `<text class="grid-label" x="${padLeft - 6}" y="${y + 3}" text-anchor="end">${val.toLocaleString()}</text>`;
    }

    data.forEach((d, i) => {
      const x = padLeft + i * (barW + gap);
      const barH = (d.pv / yMax) * chartH;
      const y = padTop + chartH - barH;
      svg += `<rect class="bar-rect" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(barH, 0).toFixed(1)}" rx="1.5"><title>${formatDateLabel(d.date)}: ${d.pv.toLocaleString()} PV</title></rect>`;

      if (i % labelStep === 0 || i === n - 1) {
        const lx = x + barW / 2;
        svg += `<text class="axis-label" x="${lx.toFixed(1)}" y="${height - padBottom + 16}" text-anchor="middle">${formatDateLabel(d.date)}</text>`;
      }
    });

    svgEl.innerHTML = svg;
  }

  document.getElementById("pvBarPeriod").addEventListener("change", () => {
    loadPvBarChart();
  });

  // ============================================================
  // ② カテゴリーランキング推移（線グラフ、1〜10位）
  // ============================================================

  let trendLineVisibility = [];

  // 「カテゴリーランキング推移」セクションが今、開いて表示されているかどうか
  function isTrendVisible() {
    return document.getElementById("trendBody").style.display !== "none";
  }

  function trendCacheKey(category, period) {
    return category + "|" + period;
  }

  // 「表示する」ボタンを押したとき、またはタブ・期間が変わって開いている状態を
  // 更新したいときに呼ぶ。今のタブの1〜10位について線グラフを取得する。
  async function loadTrendChart() {
    if (!categoriesCache) return;

    const items = (categoriesCache[currentCategory] || []).slice(0, 10);
    const trendEmpty = document.getElementById("trendEmpty");
    const trendSvg = document.getElementById("trendSvg");
    const trendLegend = document.getElementById("trendLegend");

    if (items.length === 0) {
      trendEmpty.textContent = "この期間・カテゴリーのデータはありません";
      trendEmpty.style.display = "block";
      trendSvg.style.display = "none";
      trendLegend.innerHTML = "";
      return;
    }

    const period = currentPeriod();
    const key = trendCacheKey(currentCategory, period);
    const cached = trendCache[key];
    const now = Date.now();

    if (cached && (now - cached.timestamp) < CACHE_TTL_MS) {
      renderTrendChart(items, cached.dates, cached.series);
      return;
    }

    setChartLoading("trendEmpty", "trendSvg");

    try {
      const paths = items.map(item => item.path);
      const url = GAS_URL + "?type=pageTrend&paths=" + encodeURIComponent(paths.join(",")) + "&start=" + period + "&end=today";
      const res = await fetch(url);
      const data = await res.json();
      if (data.ok) {
        trendCache[key] = { timestamp: now, dates: data.dates, series: data.series };
        renderTrendChart(items, data.dates, data.series);
      } else {
        trendEmpty.textContent = "取得エラー: " + data.error;
      }
    } catch (err) {
      trendEmpty.textContent = "通信エラーが発生しました";
      console.error("pageTrend取得失敗:", err);
    }
  }

  function renderTrendChart(items, dates, series) {
    const trendEmpty = document.getElementById("trendEmpty");
    const trendSvg = document.getElementById("trendSvg");
    const trendLegend = document.getElementById("trendLegend");

    if (!dates || dates.length < 2) {
      trendEmpty.textContent = "この期間はデータの日数が少なく、推移グラフを表示できません";
      trendEmpty.style.display = "block";
      trendSvg.style.display = "none";
      trendLegend.innerHTML = "";
      return;
    }

    trendEmpty.style.display = "none";
    trendSvg.style.display = "block";

    trendLineVisibility = items.map(() => true);

    trendLegend.innerHTML = items.map((item, i) => `
      <label class="trend-legend-item" data-idx="${i}">
        <input type="checkbox" checked data-idx="${i}">
        <span class="trend-legend-swatch" style="background:${TREND_COLORS[i % TREND_COLORS.length]}"></span>
        <span class="legend-title">${i + 1}位: ${item.title}</span>
      </label>
    `).join("");

    trendLegend.querySelectorAll('input[type="checkbox"]').forEach(cb => {
      cb.addEventListener("change", (e) => {
        const idx = parseInt(e.target.dataset.idx, 10);
        trendLineVisibility[idx] = e.target.checked;
        e.target.closest(".trend-legend-item").classList.toggle("off", !e.target.checked);
        drawTrendSvg(items, dates, series);
      });
    });

    drawTrendSvg(items, dates, series);
  }

  function drawTrendSvg(items, dates, series) {
    const trendSvg = document.getElementById("trendSvg");

    const width = 1000, height = 300;
    const padLeft = 46, padRight = 10, padTop = 16, padBottom = 34;
    const chartW = width - padLeft - padRight;
    const chartH = height - padTop - padBottom;

    let maxPv = 1;
    items.forEach((item, i) => {
      if (!trendLineVisibility[i]) return;
      const values = series[item.path] || [];
      values.forEach(v => { if (v > maxPv) maxPv = v; });
    });
    const yMax = Math.ceil(maxPv * 1.15 / 5) * 5 || 5;

    const n = dates.length;
    const stepX = n > 1 ? chartW / (n - 1) : 0;

    let labelStep = 1;
    if (n > 60) labelStep = 10;
    else if (n > 30) labelStep = 5;
    else if (n > 14) labelStep = 2;

    let svg = '';

    for (let i = 0; i <= 4; i++) {
      const val = Math.round(yMax * i / 4);
      const y = padTop + chartH - (chartH * i / 4);
      svg += `<line class="axis-line" x1="${padLeft}" y1="${y}" x2="${width - padRight}" y2="${y}" />`;
      svg += `<text class="grid-label" x="${padLeft - 6}" y="${y + 3}" text-anchor="end">${val.toLocaleString()}</text>`;
    }

    dates.forEach((date, i) => {
      if (i % labelStep === 0 || i === n - 1) {
        const x = padLeft + i * stepX;
        svg += `<text class="axis-label" x="${x.toFixed(1)}" y="${height - padBottom + 16}" text-anchor="middle">${formatDateLabel(date)}</text>`;
      }
    });

    items.forEach((item, i) => {
      if (!trendLineVisibility[i]) return;
      const values = series[item.path] || dates.map(() => 0);
      const color = TREND_COLORS[i % TREND_COLORS.length];

      const points = values.map((v, di) => {
        const x = padLeft + di * stepX;
        const y = padTop + chartH - (v / yMax) * chartH;
        return x.toFixed(1) + "," + y.toFixed(1);
      }).join(" ");

      svg += `<polyline points="${points}" fill="none" stroke="${color}" stroke-width="2" />`;

      values.forEach((v, di) => {
        const x = padLeft + di * stepX;
        const y = padTop + chartH - (v / yMax) * chartH;
        svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.5" fill="${color}"><title>${item.title} / ${formatDateLabel(dates[di])}: ${v.toLocaleString()} PV</title></circle>`;
      });
    });

    trendSvg.innerHTML = svg;
  }

  document.getElementById("trendToggleBtn").addEventListener("click", async () => {
    const wrap = document.getElementById("trendBody");
    const btn = document.getElementById("trendToggleBtn");
    const isHidden = wrap.style.display === "none";

    wrap.style.display = isHidden ? "" : "none";
    btn.textContent = isHidden ? "非表示にする" : "表示する";

    // 非表示→表示にしたときだけ、まだ取得していなければここで初めて取得する
    if (isHidden) {
      const period = currentPeriod();
      const key = trendCacheKey(currentCategory, period);
      if (!trendCache[key]) {
        await loadTrendChart();
      }
    }
  });

  // ============================================================
  // 初期読み込み：起動時は dashboardInit の1回だけでOK
  // ============================================================
  loadDashboardInit();
</script>
