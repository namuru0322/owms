<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>OWMS ダッシュボード | ワンズウィルミュージックスクール</title>
<!--
  OWMS ダッシュボード v1.6
  変更点（初版 → v1.1）：
    ・タブ切替のたびにGASへ問い合わせていたのをやめ、期間変更時に一度だけ
      「全カテゴリー分」を取得し、タブ切替はブラウザ内のデータを出し分けるだけにした。
      （GAS側 v1.6 の type=allCategories に対応）
    ・「総合」タブを新設し、起動時デフォルトで表示するように変更。
    ・タブの並び順を 総合／ボイトレ系／スクール関連／DTM系／その他ブログ に変更。
  変更点（v1.1 → v1.2）：
    ・タブの並び順を 総合／ボイトレ系／DTM系／スクール関連／その他ブログ に変更
      （「スクール関連」と「DTM系」の順序を入れ替え）。
  変更点（v1.2 → v1.3）：
    ・画面タイトルの横にバージョン番号を表示するように変更（コメントだけでなく、
      画面上で見えるようにした）。
  変更点（v1.3 → v1.4）：
    ・期間（当日／7日間／1ヶ月など）ごとにデータを15分間キャッシュするように変更。
      一度見た期間を選び直したときは、15分以内であればGASへ問い合わせずに
      直前のデータをそのまま表示する（表示が速くなる／GAS・GA4呼び出し回数が減る）。
      15分を過ぎたら自動的に取り直す。
  変更点（v1.4 → v1.5）：
    ・キャッシュ有効期間を5分→15分に変更。
  変更点（v1.5 → v1.6）：
    ・新カテゴリー「NEW」を追加。6年ぶりの更新再開（2026年5/28〜）以降に公開された
      記事だけを集めたタブ。判定はGAS側で記事URL末尾の数字ID（32395以上）で行う。
      タブ表示順を 総合／NEW／ボイトレ系／DTM系／スクール関連／その他ブログ に更新。
      （GAS側 v1.7 に対応。並び順はいまのところPV順のまま。公開日順にしたい場合は
      別途対応が必要）
-->
<style>
  :root {
    --bg: #1c2230;
    --panel: #262e40;
    --panel-2: #2f3850;
    --border: #3a4358;
    --text: #eef1f7;
    --text-muted: #9aa5bb;
    --accent: #e0a94a;
    --accent-dim: #6b5730;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 40px 32px 80px;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
    max-width: 1100px;
    margin-left: auto;
    margin-right: auto;
  }
  header { margin-bottom: 28px; }
  header .eyebrow {
    color: var(--accent);
    font-size: 13px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin: 0 0 6px;
  }
  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 30px;
    margin: 0 0 4px;
    font-weight: normal;
  }
  header p.sub { color: var(--text-muted); margin: 0; font-size: 14px; }
  header .version-tag {
    color: var(--text-muted);
    font-size: 12px;
    font-weight: normal;
    vertical-align: middle;
    margin-left: 10px;
  }

  .period-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 24px 0 20px;
  }
  .period-bar label { font-size: 13px; color: var(--text-muted); }
  select {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 10px;
    font-size: 14px;
  }

  .stat-row { display: flex; gap: 16px; margin-bottom: 32px; flex-wrap: wrap; }
  .stat-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 22px;
    min-width: 200px;
    flex: 1;
  }
  .stat-card .label { font-size: 13px; color: var(--text-muted); margin: 0 0 8px; }
  .stat-card .value { font-size: 32px; font-weight: 600; margin: 0; }
  .stat-card .value.loading { color: var(--text-muted); font-size: 18px; font-weight: normal; }

  .tabs { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
  .tab {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
  }
  .tab:hover { border-color: var(--accent-dim); color: var(--text); }
  .tab.active {
    background: var(--accent-dim);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 600;
  }

  table { width: 100%; border-collapse: collapse; background: var(--panel); border-radius: 10px; overflow: hidden; }
  thead th {
    text-align: left;
    font-size: 12px;
    color: var(--text-muted);
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    font-weight: normal;
  }
  tbody td {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
    vertical-align: top;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--panel-2); }
  td.rank { color: var(--accent); font-weight: 600; width: 36px; }
  td.pv { text-align: right; font-variant-numeric: tabular-nums; width: 70px; color: var(--text); }
  td.path { color: var(--text-muted); font-size: 12px; }
  td.title a { color: var(--text); text-decoration: none; }
  td.title a:hover { color: var(--accent); }

  .status { color: var(--text-muted); font-size: 13px; padding: 20px; text-align: center; }
</style>
</head>
<body>

<header>
  <p class="eyebrow">Ones-Will Music School</p>
  <h1>OWMS ダッシュボード<span class="version-tag">v1.6</span></h1>
  <p class="sub">サイト全体のアクセス状況とページ別ランキング</p>
</header>

<div class="period-bar">
  <label for="period">期間</label>
  <select id="period">
    <option value="today">当日</option>
    <option value="7daysAgo" selected>7日間</option>
    <option value="14daysAgo">2週間</option>
    <option value="30daysAgo">1ヶ月</option>
    <option value="60daysAgo">2ヶ月</option>
    <option value="90daysAgo">3ヶ月</option>
  </select>
</div>

<div class="stat-row">
  <div class="stat-card">
    <p class="label">アクティブユーザー数</p>
    <p class="value loading" id="activeUsersValue">読み込み中…</p>
  </div>
</div>

<!-- 並び順：総合／NEW／ボイトレ系／DTM系／スクール関連／その他ブログ -->
<div class="tabs" id="tabs">
  <div class="tab active" data-category="総合">総合</div>
  <div class="tab" data-category="NEW">NEW</div>
  <div class="tab" data-category="ボイトレ系">ボイトレ系</div>
  <div class="tab" data-category="DTM系">DTM系</div>
  <div class="tab" data-category="スクール関連">スクール関連</div>
  <div class="tab" data-category="その他ブログ">その他ブログ</div>
</div>

<table>
  <thead>
    <tr>
      <th></th>
      <th>タイトル</th>
      <th style="text-align:right;">PV</th>
    </tr>
  </thead>
  <tbody id="rankingBody">
    <tr><td colspan="3" class="status">読み込み中…</td></tr>
  </tbody>
</table>

<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycbw4tle8lv9iQdM6F2gmlUUuILh4owSHaYSk9_8WX_d2h3tOzpHD8JFjTS9oiQs9Hkh_/exec";

  // 起動時デフォルトは「総合」
  let currentCategory = "総合";

  // 直近で取得した「今表示中の期間」の全カテゴリー分データ。
  // タブ切替はここから出し分けるだけで、GASへは再アクセスしない。
  let categoriesCache = null;

  // 期間ごとのキャッシュ本体。
  // キー：期間の値（例："7daysAgo"）、値：{ timestamp, activeUsers, categories }
  // 同じ期間を選び直したとき、CACHE_TTL_MS以内ならGASへ行かずこれを使う。
  const periodCache = {};
  const CACHE_TTL_MS = 15 * 60 * 1000; // 15分間はキャッシュを使う

  function currentPeriod() {
    return document.getElementById("period").value;
  }

  function applyActiveUsers(value) {
    const el = document.getElementById("activeUsersValue");
    el.textContent = Number(value).toLocaleString() + " 人";
    el.classList.remove("loading");
  }

  // 期間プルダウンの変更時・初回読み込み時に呼ぶ。
  // キャッシュが新しければそれを使い、古い／無ければGASへ1回だけ問い合わせて
  // アクティブユーザー数＋全カテゴリー分をまとめて取得し、periodCacheに保存する。
  async function loadForPeriod() {
    const period = currentPeriod();
    const cached = periodCache[period];
    const now = Date.now();

    if (cached && (now - cached.timestamp) < CACHE_TTL_MS) {
      // キャッシュがまだ新しい → GASへ行かずそのまま使う
      applyActiveUsers(cached.activeUsers);
      categoriesCache = cached.categories;
      renderRanking();
      return;
    }

    // キャッシュが無い、または古い → GASへ問い合わせ直す
    const activeUsersEl = document.getElementById("activeUsersValue");
    activeUsersEl.textContent = "読み込み中…";
    activeUsersEl.classList.add("loading");

    const body = document.getElementById("rankingBody");
    body.innerHTML = '<tr><td colspan="3" class="status">読み込み中…</td></tr>';

    try {
      const [activeUsersRes, categoriesRes] = await Promise.all([
        fetch(GAS_URL + "?type=activeUsers&start=" + period + "&end=today"),
        fetch(GAS_URL + "?type=allCategories&start=" + period + "&end=today"),
      ]);
      const activeUsersData = await activeUsersRes.json();
      const categoriesData = await categoriesRes.json();

      if (activeUsersData.ok) {
        applyActiveUsers(activeUsersData.activeUsers);
      } else {
        activeUsersEl.textContent = "取得エラー";
      }

      if (categoriesData.ok) {
        categoriesCache = categoriesData.categories;
        renderRanking();
      } else {
        body.innerHTML = '<tr><td colspan="3" class="status">取得エラー: ' + categoriesData.error + '</td></tr>';
      }

      // 両方成功したときだけ、この期間のキャッシュとして保存する
      if (activeUsersData.ok && categoriesData.ok) {
        periodCache[period] = {
          timestamp: now,
          activeUsers: activeUsersData.activeUsers,
          categories: categoriesData.categories,
        };
      }
    } catch (err) {
      activeUsersEl.textContent = "通信エラー";
      body.innerHTML = '<tr><td colspan="3" class="status">通信エラーが発生しました</td></tr>';
      console.error(err);
    }
  }

  // タブ切替時はこちらだけを呼ぶ。GASへは一切アクセスしない。
  function renderRanking() {
    const body = document.getElementById("rankingBody");
    if (!categoriesCache) {
      body.innerHTML = '<tr><td colspan="3" class="status">読み込み中…</td></tr>';
      return;
    }
    const items = categoriesCache[currentCategory] || [];
    if (items.length > 0) {
      body.innerHTML = items.slice(0, 30).map((item, i) => `
        <tr>
          <td class="rank">${i + 1}</td>
          <td class="title">
            <a href="https://www.ones-will.com${item.path}" target="_blank">${item.title}</a>
            <div class="path">${item.path}</div>
          </td>
          <td class="pv">${item.pv.toLocaleString()}</td>
        </tr>
      `).join("");
    } else {
      body.innerHTML = '<tr><td colspan="3" class="status">この期間・カテゴリーのデータはありません</td></tr>';
    }
  }

  document.getElementById("tabs").addEventListener("click", (e) => {
    const tab = e.target.closest(".tab");
    if (!tab) return;
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    currentCategory = tab.dataset.category;
    renderRanking(); // キャッシュから出し分けるだけ。GASは呼ばない。
  });

  document.getElementById("period").addEventListener("change", () => {
    loadForPeriod(); // キャッシュが新しければGASへ行かず、古ければ取り直す
  });

  loadForPeriod();
</script>

</body>
</html>
