<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>OWMS ダッシュボード | ワンズウィルミュージックスクール</title>
<style>
  :root {
    --bg: #1c2230;
    --panel: #262e40;
    --panel-2: #2f3850;
    --border: #3a4358;
    --text: #eef1f7;
    --text-muted: #9aa5bb;
    --accent: #e0a94a;
    --accent-dim: #6b5730;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 40px 32px 80px;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
    max-width: 1100px;
    margin-left: auto;
    margin-right: auto;
  }
  header { margin-bottom: 28px; }
  header .eyebrow {
    color: var(--accent);
    font-size: 13px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin: 0 0 6px;
  }
  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 30px;
    margin: 0 0 4px;
    font-weight: normal;
  }
  header p.sub { color: var(--text-muted); margin: 0; font-size: 14px; }

  .period-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 24px 0 20px;
  }
  .period-bar label { font-size: 13px; color: var(--text-muted); }
  select {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 10px;
    font-size: 14px;
  }

  .stat-row { display: flex; gap: 16px; margin-bottom: 32px; flex-wrap: wrap; }
  .stat-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 22px;
    min-width: 200px;
    flex: 1;
  }
  .stat-card .label { font-size: 13px; color: var(--text-muted); margin: 0 0 8px; }
  .stat-card .value { font-size: 32px; font-weight: 600; margin: 0; }
  .stat-card .value.loading { color: var(--text-muted); font-size: 18px; font-weight: normal; }

  .tabs { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
  .tab {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
  }
  .tab:hover { border-color: var(--accent-dim); color: var(--text); }
  .tab.active {
    background: var(--accent-dim);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 600;
  }

  table { width: 100%; border-collapse: collapse; background: var(--panel); border-radius: 10px; overflow: hidden; }
  thead th {
    text-align: left;
    font-size: 12px;
    color: var(--text-muted);
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    font-weight: normal;
  }
  tbody td {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
    vertical-align: top;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--panel-2); }
  td.rank { color: var(--accent); font-weight: 600; width: 36px; }
  td.pv { text-align: right; font-variant-numeric: tabular-nums; width: 70px; color: var(--text); }
